name: Validate deployment changes
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  scripts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests/deployment -v
      - run: bash -n deploy/install.sh deploy/provision-debian.sh deploy/compose/configure.sh
      - name: Validate Compose without starting services
        working-directory: deploy/compose
        run: docker compose --env-file .env.example config --quiet
