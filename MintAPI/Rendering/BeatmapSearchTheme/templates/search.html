<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Harmony;src:url('{{fonts}}HarmonyOS_Sans_SC_Regular.ttf')}@font-face{font-family:Harmony;src:url('{{fonts}}HarmonyOS_Sans_SC_Bold.ttf');font-weight:700}
*{box-sizing:border-box}html,body{margin:0;width:900px;background:#17151c;color:#fff;font-family:Harmony,sans-serif}body{position:relative;padding:18px 20px 0}header{height:56px;display:flex;align-items:flex-start;justify-content:space-between;gap:22px}header h1{font-size:20px;margin:0;max-width:660px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}header p{font-size:12px;color:#a49baa;margin:5px 0}header .label{font-size:11px;color:#e6a5c8;letter-spacing:2px;margin-top:6px;white-space:nowrap}.row{height:96px;position:relative;overflow:hidden;margin-bottom:6px;background:#302737}.background{position:absolute;width:100%;height:100%;object-fit:cover;object-position:center 45%}.background[src='']{display:none}.shade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(17,15,23,.91) 0%,rgba(17,15,23,.79) 45%,rgba(17,15,23,.28) 76%,rgba(17,15,23,.42) 100%)}.number{position:absolute;left:15px;top:19px;color:#c5b6c5;font-size:17px}.info{position:absolute;left:54px;top:12px;max-width:650px;width:650px}h2{font-size:22px;line-height:27px;margin:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;text-shadow:0 1px 5px #000}p{font-size:13px;margin:2px 0 7px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;color:#f2eaf1}p span{color:#c9bccb}.difficulties{display:flex;gap:5px;align-items:center;height:20px}.difficulty{width:19px;height:19px;display:inline-flex;filter:drop-shadow(0 0 1px #fff9)}.difficulty svg{width:100%;height:100%}.muted{opacity:.25}.more{font-size:12px;color:#c8bbcb;margin-left:4px}.status{position:absolute;right:16px;top:15px;font-size:10px;letter-spacing:1px;padding:4px 7px;background:#17151cb3;color:#e9dfeb}.set-id{position:absolute;right:16px;bottom:15px;font-size:12px;color:#e9dfeb;padding:4px 7px;background:#17151cb3;text-shadow:0 1px 4px #000}.empty{text-align:center;padding:52px 0;color:#ddd;font-size:20px}.empty small{font-size:13px;color:#9f94a4}footer{display:flex;gap:16px;align-items:center;font-size:11px;color:#a49baa;padding:7px 2px 12px;line-height:18px}
</style></head><body><header><div><h1>{{query}}</h1><p>{{filters}}</p></div><div class="label">BEATMAP SEARCH</div></header><main>{{rows}}</main><footer><span>本批 {{page}}</span><span>共搜到 {{total}} 个 BeatmapSet</span></footer></body></html>
